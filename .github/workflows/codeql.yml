name: CodeQL

# Runs on upload to GitHub (push), on pull requests, weekly, and on manual dispatch.
# Push is restricted to main to mirror ci.yml: with a pull_request trigger as
# well, every push to a PR branch would otherwise run the same commit twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 06:00 UTC — keeps the CodeQL database fresh even
    # when no code was pushed (covers stale-result expiry and new queries).
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A new push to a PR supersedes its in-flight scan; every other run is its
# own group, so no main scan is ever cancelled — same policy as ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action below is pinned to a commit SHA rather than a tag. A tag is a
# mutable pointer: whoever controls it controls a job running in this
# repository. The sibling server repo and ci.yml already hold this standard.

jobs:
  analyze:
    name: codeql-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # Only java-kotlin builds. The others are read from source: the workflows themselves,
        # the .mjs fixtures and store-screenshot helpers, and the Python beside them.
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradle/wrapper/gradle-wrapper.jar is committed to this repository, so
      # CI executes a binary out of the tree it is testing. This check stops a
      # swapped jar from running: it verifies the jar against the checksums
      # Gradle publishes for every release. Must come before any ./gradlew
      # invocation (including the autobuild step below).
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.build-mode == 'manual'

      # Temurin 25: same JDK as ci.yml. Gradle 9.6 officially supports 25;
      # CodeQL's autobuild invokes Gradle, so the toolchain must match.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.build-mode == 'manual'
        with:
          distribution: temurin
          java-version: "25"
      # ci.yml's Gradle User Home cache, read-only; see the note there.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.build-mode == 'manual'
        with:
          cache-provider: basic
          cache-read-only: true

      - uses: ./.github/actions/placeholder-google-services
        if: matrix.build-mode == 'manual'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.build-mode }}

      # --no-build-cache: CodeQL extracts what the compiler runs, and a task restored from the
      # build cache compiles nothing.
      - name: Build for CodeQL
        if: matrix.build-mode == 'manual'
        run: ./gradlew assembleDebug --no-build-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
