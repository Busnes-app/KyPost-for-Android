name: ci-fdroid-release

# Launches the minified F-Droid release build on an emulator. See release-smoke.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fdroid:
    name: ci-fdroid-release
    uses: ./.github/workflows/release-smoke.yml
    with:
      flavor: Fdroid
