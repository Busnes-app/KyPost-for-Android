name: release-smoke

# Installs one flavor's minified release build on an emulator and runs
# app/src/releaseSmoke against it. Called by ci-play-release.yml and ci-fdroid-release.yml, so
# each flavor reports as its own check. ci.yml's emulator legs only ever run debug, and a missing
# R8 keep rule only shows on the release build, at launch.
#
# No secrets, on purpose: the callers run on pull_request. The release key lives on release.yml's
# protected environment, which this workflow never names. The build is signed with a key generated
# for this run (the same throwaway as ci-release-build) and the APK is never published.
on:
  workflow_call:
    inputs:
      flavor:
        description: Capitalised flavor name, as in connected<Flavor>ReleaseAndroidTest.
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: ./.github/actions/placeholder-google-services

      - name: throwaway signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-throwaway.jks" -alias ci \
            -keyalg RSA -keysize 4096 -validity 30 \
            -storepass ci-throwaway -keypass ci-throwaway \
            -dname "CN=KyPost CI, O=Verification Only, C=US"
          {
            echo "KYPOST_KEYSTORE=$RUNNER_TEMP/ci-throwaway.jks"
            echo "KYPOST_STORE_PASSWORD=ci-throwaway"
            echo "KYPOST_KEY_ALIAS=ci"
            echo "KYPOST_KEY_PASSWORD=ci-throwaway"
          } >> "$GITHUB_ENV"

      # Built before the emulator boots, so a build failure does not cost an emulator start.
      - name: build release and smoke test APKs
        run: ./gradlew -PkypostReleaseSmoke :app:assemble${{ inputs.flavor }}Release :app:assemble${{ inputs.flavor }}ReleaseAndroidTest

      # Same emulator setup as ci.yml's instrumented job, minus the lock-screen PIN: nothing here
      # needs a secure keyguard, and that PIN is what made the keyguard hard to dismiss there.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One `sh -c` per line, as in ci.yml: no multi-line constructs, no state between lines.
          script: |
            adb wait-for-device
            adb shell input keyevent 224
            adb shell wm dismiss-keyguard
            adb logcat -c || true
            ./gradlew -PkypostReleaseSmoke connected${{ inputs.flavor }}ReleaseAndroidTest || echo failed > /tmp/testfail.txt
            adb logcat -d > /tmp/logcat.txt 2>/dev/null || true
            grep -A3 "FATAL EXCEPTION" /tmp/logcat.txt > /tmp/crashes.txt || true
            cat /tmp/crashes.txt
            if grep -q "Process: org.kysecurity.mail" /tmp/crashes.txt; then echo "The release build crashed; see the logcat excerpt above." >&2; exit 1; fi
            if [ -f /tmp/testfail.txt ]; then echo "release smoke tests failed" >&2; exit 1; fi

      - name: smoke test report
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -exec grep -l '<failure' {} + | while read -r f; do
            echo "=== $f ==="
            cat "$f"
          done || true
