name: release-smoke

# Installs one flavor's minified release build on an emulator and runs scripts/release-smoke.sh
# against it. Called twice by ci.yml, so each flavor reports as its own check. ci.yml's emulator
# legs only ever run debug, and a missing R8 keep rule only shows on the release build, at launch.
#
# No secrets, on purpose: the caller runs on pull_request. The release key lives on release.yml's
# protected environment, which this workflow never names. The APK is ci-release-build's, signed with
# that job's throwaway key, and is never published. Its R8 mapping, for retracing a stall report,
# is in the same release-<flavor> artifact.
on:
  workflow_call:
    inputs:
      flavor:
        description: Flavor name as in app/build.gradle.kts, e.g. play.
        required: true
        type: string
      package:
        description: The flavor's applicationId.
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLAVOR: ${{ inputs.flavor }}
      PACKAGE: ${{ inputs.package }}
    steps:
      # For scripts/release-smoke.sh only; nothing here builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.flavor }}
          path: ${{ runner.temp }}/release
      - name: the release APK
        run: cp "$RUNNER_TEMP/release/apk/$FLAVOR/release/app-$FLAVOR-release.apk" "$RUNNER_TEMP/smoke.apk"

      # Same emulator setup as ci.yml's instrumented job, minus the lock-screen PIN: nothing here
      # needs a secure keyguard, and that PIN is what made the keyguard hard to dismiss there.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One `sh -c` per line, as in ci.yml: no multi-line constructs, no state between lines.
          script: |
            adb wait-for-device
            adb shell input keyevent 224
            adb shell wm dismiss-keyguard
            sh scripts/release-smoke.sh "$RUNNER_TEMP/smoke.apk" "$PACKAGE"
