name: release

# Publishes a signed APK to a GitHub Release when a version tag is pushed.
#
# Deliberately a separate file from ci.yml. This workflow is the only thing in the repository
# that touches the real signing key and the real Firebase config, and it must never share a
# trigger with `pull_request` — that event runs code from an untrusted branch, and any job in
# reach of these secrets would hand the release key to whoever opened the PR. Tag pushes can
# only come from someone who can already write to this repository.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: publish-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A protected environment, NOT bare repo secrets. Create it under Settings → Environments
    # with the required reviewers you want, and store the four secrets below on the environment
    # rather than on the repository. Without this, every secret here is readable by any workflow
    # anyone with write access can add. With it, publishing pauses for an approval.
    environment: release

    permissions:
      # Only for creating the Release and attaching the APK. Everything else stays read-only.
      contents: write
      # Reading ci.yml's run for the tagged commit.
      actions: read

    steps:
      # Full history: the gate below needs origin/main and every v* tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Before any secret is decoded. Play rejects a reused versionCode and Android refuses to
      # install over a higher one, so the new code must exceed every other v* tag's. A tag whose
      # versionCode cannot be read fails the release rather than being skipped.
      - name: tag is on main, passed CI and raises versionCode
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "${TAG} (${sha}) is not on main." >&2
            exit 1
          fi
          passed=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&branch=main&event=push&status=success" \
            --jq '.total_count')
          if ! [ "$passed" -ge 1 ]; then
            echo "No successful ci.yml push run on main for ${sha}. Tag a main commit CI passed." >&2
            exit 1
          fi

          version_code() {
            git show "$1:app/build.gradle.kts" \
              | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p'
          }
          current=$(version_code HEAD) || current=
          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            echo "Cannot read versionCode from app/build.gradle.kts." >&2
            exit 1
          fi
          while read -r tag; do
            [ "$tag" = "$TAG" ] && continue
            previous=$(version_code "refs/tags/${tag}") || previous=
            if ! [[ "$previous" =~ ^[0-9]+$ ]]; then
              echo "Cannot read versionCode at ${tag}; refusing to guess." >&2
              exit 1
            fi
            if [ "$current" -le "$previous" ]; then
              echo "versionCode ${current} does not exceed ${previous} at ${tag}." >&2
              exit 1
            fi
          done < <(git tag -l 'v*')
          echo "versionCode=${current} on main at ${sha}, CI passed"
          echo "version_code=${current}" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # No Gradle cache: a cache written by another workflow must not feed the signing build.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # The real Firebase config, not the CI placeholder. This is the difference between a
      # published build where push notifications work and one where they fail silently — the
      # app builds, installs and runs identically either way, so nothing downstream would
      # catch a placeholder. Hence the explicit rejection below.
      #
      # Both flavor packages are now REGISTERED in Firebase project device-streaming-e3aa5b87
      # ("KyPost (Github)" and "KyPost (FDroid)"), and GOOGLE_SERVICES_JSON was rotated on
      # 2026-08-26 to the file Firebase itself generates for them. Registration is what matters,
      # not the json: the check below only verifies the secret NAMES each package, and a
      # google-services.json naming a package Firebase has never registered passes it just as
      # well — then ships an app whose FirebaseMessaging.getToken() fails at runtime, which
      # breaks pairing outright, since pairing hard-requires a token. If a channel is ever added,
      # register it in Firebase and re-export the secret; do not hand-edit the json.
      - name: production google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "GOOGLE_SERVICES_JSON is not set on the 'release' environment." >&2
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          if grep -q 'kypost-ci-placeholder' app/google-services.json; then
            echo "GOOGLE_SERVICES_JSON holds the CI placeholder project; push would not work." >&2
            exit 1
          fi
          # One client per flavor. The google-services plugin fails any variant whose
          # applicationId it cannot find, so a secret that is missing one silently means that
          # channel's release never builds -- discovered at tag time, which is the worst moment.
          for pkg in org.kysecurity.mail org.kysecurity.mail.github org.kysecurity.mail.fdroid; do
            if ! grep -q "\"package_name\": *\"${pkg}\"" app/google-services.json; then
              echo "GOOGLE_SERVICES_JSON does not name package ${pkg}." >&2
              exit 1
            fi
          done

      - name: release signing material
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "${RELEASE_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          # Into the environment, not a file and not a command line. A command line puts the
          # password in the process table for the life of the build; a file leaves it on the
          # runner's disk until the cleanup step, and is the exact shape
          # checkSigningSecretsAreNotInTheTree exists to refuse. The build reads KYPOST_* first
          # for this reason — see signingValue() in app/build.gradle.kts.
          {
            printf 'KYPOST_KEYSTORE=%s\n' "${RUNNER_TEMP}/release.jks"
            printf 'KYPOST_STORE_PASSWORD=%s\n' "${RELEASE_STORE_PASSWORD}"
            printf 'KYPOST_KEY_ALIAS=%s\n' "${RELEASE_KEY_ALIAS}"
            printf 'KYPOST_KEY_PASSWORD=%s\n' "${RELEASE_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      # Two invocations on purpose. ndk.abiFilters is global to the variant, so a single command
      # cannot produce a full-ABI bundle and an arm-only APK. The Play bundle is built first and
      # without the flag, so Play keeps serving x86_64 Chromebooks; the sideloaded APK is built
      # with it and sheds ~10 MB of libsqlcipher.so nobody sideloading a phone can use.
      - name: assemble release
        run: |
          set -euo pipefail
          # play only: the bundle is the Play upload artifact, and Play is the only channel that
          # takes one. github/fdroid ship APKs.
          ./gradlew checkSigningSecretsAreNotInTheTree :app:bundlePlayRelease
          # github only, arm-only: this is the sideload APK. The Play bundle above must NOT carry
          # the flag, so Play keeps every ABI and x86_64 Chromebooks still get served.
          # fdroid is built by F-Droid's own infrastructure from source, never here.
          ./gradlew -PkypostArmOnlyApk :app:assembleGithubRelease

      - name: dependency verification metadata is unchanged
        run: git diff --exit-code -- gradle/verification-metadata.xml

      # versionCode/versionName are hardcoded in app/build.gradle.kts, so the tag and the
      # manifest can disagree — and the failure is silent and expensive: Play rejects a
      # duplicate versionCode outright, and a sideloaded APK whose versionCode did not
      # increase will not install over the copy already on the device.
      #
      # github.ref_name goes through the environment, never into the shell text. Git permits
      # `$` and backticks in a tag name, so interpolating it directly into a run: block is a
      # command-injection sink.
      - name: tag matches the versioned manifest
        env:
          TAG: ${{ github.ref_name }}
          GATED_VERSION_CODE: ${{ steps.gate.outputs.version_code }}
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/github/release/output-metadata.json
          version_name=$(jq -r '.elements[0].versionName' "$metadata")
          version_code=$(jq -r '.elements[0].versionCode' "$metadata")
          echo "tag=${TAG} versionName=${version_name} versionCode=${version_code}"
          if [ "${TAG#v}" != "${version_name}" ]; then
            echo "Tag ${TAG} does not match versionName ${version_name} in app/build.gradle.kts." >&2
            exit 1
          fi
          # The gate parsed the source; this proves the APK carries what it checked.
          if [ "${version_code}" != "${GATED_VERSION_CODE}" ]; then
            echo "APK versionCode ${version_code} is not the gated ${GATED_VERSION_CODE}." >&2
            exit 1
          fi

      # Proves the artifact carries the key we think it does, before it reaches anyone. A
      # swapped or regenerated keystore secret produces a perfectly valid APK signed by the
      # wrong identity — which no user can install over their existing app, and which cannot
      # be walked back once published. Store the expected fingerprint as
      # RELEASE_KEY_SHA256 (the bare uppercase hex digest, colons optional):
      #   keytool -list -v -keystore your.jks -alias your-alias | grep 'SHA256:'
      - name: signer identity is the expected release key
        env:
          EXPECTED_SHA256: ${{ secrets.RELEASE_KEY_SHA256 }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/github/release/app-github-release.apk
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)

          expected=$(printf '%s' "${EXPECTED_SHA256}" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$expected" ]; then
            echo "RELEASE_KEY_SHA256 is not set on the 'release' environment." >&2
            exit 1
          fi

          # The signature is valid at all — separate from, and prior to, asking whose it is.
          "$apksigner" verify "$apk"

          # Matched on the part of the label that is stable across build-tools versions.
          # build-tools 36 prints "Signer #1 certificate SHA-256 digest: <hex>" and 37 prints
          # "V2 Signer: certificate SHA-256 digest: <hex>"; anchoring on the older wording
          # yielded an empty string on 37, which reads downstream as a key mismatch rather
          # than as the parse failure it is.
          actual=$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)
          if [ -z "$actual" ]; then
            echo "Could not read a signer digest out of ${apksigner}; parsing needs updating." >&2
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "APK is signed by ${actual}, expected ${expected}. Refusing to publish." >&2
            exit 1
          fi
          echo "Signer verified: ${actual}"

      - name: name the artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/github/release/app-github-release.apk "${RUNNER_TEMP}/kypost-${TAG}.apk"
          sha256sum "${RUNNER_TEMP}/kypost-${TAG}.apk" \
            | sed "s|${RUNNER_TEMP}/||" > "${RUNNER_TEMP}/kypost-${TAG}.apk.sha256"

          # App Bundle for Google Play
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "${RUNNER_TEMP}/kypost-${TAG}.aab"
          sha256sum "${RUNNER_TEMP}/kypost-${TAG}.aab" \
            | sed "s|${RUNNER_TEMP}/||" > "${RUNNER_TEMP}/kypost-${TAG}.aab.sha256"

      # R8's mapping files, one per published flavor, kept as a workflow artifact rather than
      # attached to the Release. Without them crash reports from this build are unreadable;
      # published alongside the APK they also hand an analyst a full symbol table for a
      # security-sensitive binary. Retained long enough to outlive the release they belong to.
      #
      # Checked explicitly before uploading: if-no-files-found: error only fires when NEITHER
      # path matches, so losing just the github mapping (or just the play one) would otherwise
      # upload the other silently and nothing would say a mapping file went missing.
      - name: both R8 mapping files exist
        run: |
          set -euo pipefail
          test -f app/build/outputs/mapping/playRelease/mapping.txt
          test -f app/build/outputs/mapping/githubRelease/mapping.txt

      - name: retain the R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.ref_name }}
          path: |
            app/build/outputs/mapping/playRelease/mapping.txt
            app/build/outputs/mapping/githubRelease/mapping.txt
          retention-days: 90
          if-no-files-found: error

      # The bundle is the Play upload artifact and nothing else. An AAB cannot be installed --
      # sideloading it requires bundletool and a signing key -- so on the Releases page it is
      # 17 MB of dead weight next to the APK that people actually want, and a real share of
      # visitors download the wrong file and conclude the release is broken. Kept here, where
      # whoever uploads to Play can fetch it.
      - name: retain the Play bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/kypost-${{ github.ref_name }}.aab
            ${{ runner.temp }}/kypost-${{ github.ref_name }}.aab.sha256
          retention-days: 90
          if-no-files-found: error

      # `gh` is preinstalled on the runner, so this needs no third-party action — one less
      # entry in the supply chain of a job that holds the signing key.
      #
      # --draft on purpose: the release is assembled but not announced, so the APK can be
      # installed and checked before anyone is told it exists. Publish it from the Releases
      # page when satisfied.
      - name: publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --draft \
            --title "${TAG}" \
            --generate-notes \
            "${RUNNER_TEMP}/kypost-${TAG}.apk" \
            "${RUNNER_TEMP}/kypost-${TAG}.apk.sha256"

      - name: destroy signing material
        if: always()
        run: |
          shred -u "${RUNNER_TEMP}/release.jks" 2>/dev/null || true
