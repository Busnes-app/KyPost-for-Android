version: 2

# Gradle PRs fail CI until gradle/verification-metadata.xml is regenerated locally and reviewed;
# see the comment at the top of gradle/libs.versions.toml. Never regenerate it in CI.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # A week for a compromised release to be noticed before it is proposed here.
    cooldown:
      default-days: 7
    # Majors stay separate PRs; they need their own testing.
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Held bumps, each explained in gradle/libs.versions.toml. Drop an entry when its note goes.
    ignore:
      # core 1.19 and okhttp-android 5.5 require compileSdk 37 (checkAarMetadata).
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      - dependency-name: "com.squareup.okhttp3:okhttp"
        versions: [">=5.5.0"]
      # Breaks Run4SanitizerMxssProbeTest; a later release may fix it.
      - dependency-name: "org.jsoup:jsoup"
        versions: ["1.23.2"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
