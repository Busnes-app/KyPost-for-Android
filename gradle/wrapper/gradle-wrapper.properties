distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
# From services.gradle.org/distributions/gradle-9.8.0-bin.zip.sha256. validateDistributionUrl
# only checks that the URL is well-formed HTTPS; it does not verify a single byte of the
# archive. Without this line the one artifact that EXECUTES this build arrived unverified,
# while gradle/verification-metadata.xml pinned 600+ artifacts that merely link into it.
# Update it in the same commit as distributionUrl, never separately.
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
