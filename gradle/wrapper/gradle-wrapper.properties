distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.1-bin.zip
# From services.gradle.org/distributions/gradle-9.9.1-bin.zip.sha256. validateDistributionUrl
# only checks that the URL is well-formed HTTPS; it does not verify a single byte of the
# archive. Without this line the one artifact that EXECUTES this build arrived unverified,
# while gradle/verification-metadata.xml pinned 600+ artifacts that merely link into it.
# Update it in the same commit as distributionUrl, never separately.
distributionSha256Sum=d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
