securityCrypto = "1.1.0"
# Newest stable, and abandoned at this branch. Audited 2026-08-21; staying on 1.1.0 deliberately.
#
# What is relied on (the whole surface — nothing else is imported):
#   BiometricManager.from().canAuthenticate(BIOMETRIC_STRONG)          UnlockActivity availability gate
#   PromptInfo.Builder.setAllowedAuthenticators(BIOMETRIC_STRONG)      UnlockActivity
#   ...setAllowedAuthenticators(BIOMETRIC_STRONG or DEVICE_CREDENTIAL) VaultOpenerAndroid, DeviceEnrollmentActivity
#   BiometricPrompt(activity, executor, AuthenticationCallback)        all three
#   prompt.authenticate(info, CryptoObject(cipher)) / cancelAuthentication()
#
# Why the abandonment is tolerable: this library is UI glue, not the trust boundary. Every secret
# is sealed under an AndroidKeyStore key built with setUserAuthenticationRequired(true) and
# setUserAuthenticationParameters(0, ...) — per-use auth (EnrollmentVault, BiometricUnlockVault).
# The Keystore, not androidx.biometric, refuses to unwrap the cipher without a fresh user auth, so
# a library defect can drop or mis-render a prompt but cannot hand back an unauthenticated key.
# BiometricUnlockVault additionally sets setInvalidatedByBiometricEnrollment(true).
#
# Known 1.1.0 defects and their handling:
#   - the prompt is not resolved across a configuration change; DeviceEnrollmentActivity.onDestroy
#     resolves it by hand (see the comment there).
#   - a prompt requested after FragmentManager state-save is dropped with no callback; every call
#     site checks isStateSaved on Main immediately before authenticate().
#
# API-level matrix: minSdk 31 / targetSdk 36. The CryptoObject-with-DEVICE_CREDENTIAL combination
# is unsupported below API 30, which minSdk 31 puts out of reach. UNPROVEN: no instrumented run
# across the 31..36 matrix exists — TlsPinNarrowingTest-style androidTest coverage for the two
# CryptoObject paths is the outstanding work, not another version bump.
#
# The 1.2.0-alpha line buys AndroidX Credential Manager interop we do not use. Revisit only if a
# defect above stops being workable-around, or if a stable 1.2.0 ships.
biometric = "1.1.0"
workRuntime = "2.12.0"
lifecycleProcess = "2.9.4"
room = "2.8.5"
sqlcipher = "4.19.1"
ksp = "2.3.12"
bouncyCastlePgp = "1.86"
jsoup = "1.23.2"
zxingCore = "3.5.4"
zxingEmbedded = "4.3.0"
richHtmlEditor = "1.1.0"
unifiedPush = "3.3.5"
window = "1.5.1"
startupRuntime = "1.2.0"

