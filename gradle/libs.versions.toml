# DEFERRED BUMPS. Three entries below are 3+ years stale and are NOT security fixes, so they were
# deliberately kept out of the security pass rather than mixed into it:
#
#   androidx-cardview  1.0.0  (2018)   androidx-core-ktx  1.10.1  (May 2023)
#   biometric          1.1.0  (2021)   <- see its own note below; this one is security-relevant
#
# core-ktx 1.19.1 and okhttp 5.5.0 require compileSdk 37 (checkAarMetadata); both stay put
# until compileSdk moves in its own change.
#
# Bumping any of them means regenerating gradle/verification-metadata.xml, which is the file CI
# watches most closely. Do it in its own commit:
#
#   ./gradlew --write-verification-metadata sha256 help
#
# NEVER from inside CI — see the block comment in .github/workflows/ci.yml for why that would
# defeat the control. Let the 31/34/36 emulator matrix catch the UI regressions.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.10.1"
activityKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
testCore = "1.7.0"
appcompat = "1.8.0"
material = "1.14.0"
recyclerview = "1.4.0"
